name: Build the package

on:
  workflow_call:

jobs:
  package:
    timeout-minutes: 30
    name: Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
        - name: Checkout code
          uses: actions/checkout@v4
        - uses: prefix-dev/setup-pixi@v0.8.1
        - name: Run the package command
          run: pixi run build
