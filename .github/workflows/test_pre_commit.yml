name: Check formatting
on:
  workflow_call:

jobs:
  lint:
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
      - name: Fail if `pixi run format` changes anything
        run: pixi run format && git diff --exit-code
